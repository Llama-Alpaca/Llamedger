# Gradle JVM 内存与编码
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# 本项目纯 Java + 平台 API，不用 AndroidX
android.useAndroidX=false

# 固定 Gradle 使用的 JDK（本机是 JDK 11）。
# 说明：Android Studio 自带的是 JDK 25，而 AGP 7.4 / Gradle 7.6 需要用 JDK 11，
# 所以这里显式指定。换机器或装了别的 JDK 时，改这一行即可。
org.gradle.java.home=C\:\\Program Files\\Microsoft\\jdk-11.0.16.101-hotspot
